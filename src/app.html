<!doctype html>
<html lang="fr" data-theme="auto">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="apple-mobile-web-app-title" content="Tradition Apostolique" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#000000" />
		<!-- Self-hosted critical fonts preloaded so the first paint
		     doesn't show a flash of unstyled text. Poppins-Light is the
		     body default; Playfair italic carries every H1. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/Poppins-Light.woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/PlayfairDisplay-MediumItalic.woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
