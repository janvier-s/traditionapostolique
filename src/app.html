<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<!-- External (not inline) theme bootstrap so it's allowed under
		     the page CSP via the 'self' src directive. Must run before
		     anything else in <head> so the theme class + inline bg/fg
		     land on <html> before the browser's first paint. -->
		<script src="/theme-init.js"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Tradition Apostolique" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#000000" />
		<!-- Self-hosted critical fonts preloaded so the first paint
		     doesn't show a flash of unstyled text. Poppins-Light is the
		     body default; Playfair italic carries every H1. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/Poppins-Light.woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/PlayfairDisplay-MediumItalic.woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
