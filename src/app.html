<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<!-- Synchronous theme bootstrap. Runs BEFORE any paint so the
		     correct theme class lands on <html> before the browser
		     renders. Without this, a stored dark/sepia/amoled theme
		     would flash light for a frame on each load. Mirrors the
		     load() logic in src/lib/stores/theme.svelte.ts. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'sepia' || t === 'dark' || t === 'amoled') {
						document.documentElement.classList.add(t);
					}
				} catch (e) {
					/* localStorage may be unavailable (privacy mode); fall through to light */
				}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="apple-mobile-web-app-title" content="Tradition Apostolique" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#000000" />
		<!-- Self-hosted critical fonts preloaded so the first paint
		     doesn't show a flash of unstyled text. Poppins-Light is the
		     body default; Playfair italic carries every H1. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/Poppins-Light.woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="/fonts/PlayfairDisplay-MediumItalic.woff2"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
